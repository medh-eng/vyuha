name: Android build

# Builds the Google Play bundle (.aab) and a phone-test APK from the game files.
# Runs on pull requests that touch the app, and by hand from the Actions tab
# ("Run workflow"). The files appear under the run's "Artifacts".
#
# Signing: add four repository secrets (Settings → Secrets and variables → Actions):
#   VYUHA_UPLOAD_KEYSTORE_B64   the upload key file (.jks), base64-encoded
#   VYUHA_UPLOAD_STORE_PASSWORD
#   VYUHA_UPLOAD_KEY_ALIAS
#   VYUHA_UPLOAD_KEY_PASSWORD
# Without them the bundle is built unsigned (fine for checking the build, not for Play).
on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/build-www.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # the Ubuntu runner already carries the Android SDK (ANDROID_HOME); Gradle fetches
      # the API 36 platform itself (the setup-android action failed on 'tools', 17 Nov)
      - name: Game files into the app
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npm install --ignore-scripts --no-audit --no-fund
          node tools/build-www.mjs
          npx cap sync android
      - name: Upload key
        env:
          KEY_B64: ${{ secrets.VYUHA_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "VYUHA_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "::warning::No upload key secrets — the .aab is unsigned and cannot go to Play."
          fi
      - name: Build bundle and test APK
        working-directory: android
        env:
          VYUHA_UPLOAD_STORE_PASSWORD: ${{ secrets.VYUHA_UPLOAD_STORE_PASSWORD }}
          VYUHA_UPLOAD_KEY_ALIAS: ${{ secrets.VYUHA_UPLOAD_KEY_ALIAS }}
          VYUHA_UPLOAD_KEY_PASSWORD: ${{ secrets.VYUHA_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vyuha-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vyuha-phone-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
